<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tab URL Manager</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Open Tabs</h1>
      <span id="tab-count" class="badge">0</span>
    </header>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Filter tabs..." />
    </div>

    <div class="toolbar actions-row">
      <button id="copy-all" class="primary">Copy All URLs</button>
      <button id="close-duplicates">Close Duplicates</button>
    </div>

    <p id="copy-status" class="status" hidden></p>

    <ul id="tab-list"></ul>

    <p id="empty-state" class="empty" hidden>No tabs match your search.</p>

    <footer>
      <button id="edit-shortcut" class="link-btn">Customize keyboard shortcut</button>
      <div class="credit">
        <span id="version"></span> · Built by Muntasir
      </div>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
