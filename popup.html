<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tab URL Manager</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Open Tabs</h1>
      <span id="tab-count" class="badge">0</span>
      <button id="theme-toggle" class="icon-btn" title="Toggle theme">🖥️</button>
    </header>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Filter tabs..." />
      <select id="sort-by" title="Sort tabs by">
        <option value="window">By window</option>
        <option value="title">By title</option>
        <option value="domain">By domain</option>
        <option value="recent">Recently active</option>
      </select>
    </div>

    <div class="toolbar actions-row">
      <button id="copy-all" class="primary">Copy All URLs</button>
      <button id="close-duplicates">Close Duplicates</button>
      <button id="export-bookmarks">Export as Bookmarks</button>
      <button id="export-file">Export to File</button>
      <button id="add-reading-list">Add to Reading List</button>
    </div>

    <p id="copy-status" class="status" hidden></p>

    <details id="copy-settings-panel" class="panel">
      <summary>Copy Settings</summary>

      <div class="settings-grid">
        <div class="settings-col">
          <div class="settings-label">Include</div>
          <label class="radio"><input type="radio" name="copy-scope" value="all" checked /> Copy All URLs</label>
          <label class="radio"><input type="radio" name="copy-scope" value="web" /> Only web-pages (<i>http://</i> and <i>https://</i> pages)</label>

          <div class="settings-label">Export tabs from</div>
          <label class="radio"><input type="radio" name="copy-export-from" value="all" checked /> All windows</label>
          <label class="radio"><input type="radio" name="copy-export-from" value="current" /> Current (active) window</label>
        </div>
        <div class="settings-col">
          <div class="settings-label">Format</div>
          <label class="radio"><input type="radio" name="copy-format" value="url" checked /> URLs only: {url}</label>
          <label class="radio"><input type="radio" name="copy-format" value="titleUrl" /> Title and URL: {title}\n{url}\n</label>
          <label class="radio"><input type="radio" name="copy-format" value="html" /> HTML: &lt;a href="{url}"&gt;{title}&lt;/a&gt;</label>
          <label class="radio"><input type="radio" name="copy-format" value="csv" /> CSV: "{title}","{url}"</label>
          <label class="radio"><input type="radio" name="copy-format" value="json" /> JSON</label>
          <label class="radio"><input type="radio" name="copy-format" value="custom" /> Custom</label>
          <input id="copy-custom-template" type="text" placeholder="{title} - {url}" hidden />
        </div>
      </div>

      <div class="panel-actions">
        <button id="restore-copy-defaults">Restore default settings</button>
        <button id="copy-help" class="link-btn">Help</button>
      </div>
    </details>

    <details id="page-links-panel" class="panel">
      <summary>Page Links</summary>

      <p class="hint">
        Ctrl + drag on the page to select an area and grab its links, or hover any link
        and press Ctrl+C to copy it instantly.
      </p>

      <div class="panel-actions">
        <button id="find-all-page-links" class="primary">Find All Links on Page</button>
        <button id="get-selection-links">Get Last Selection</button>
      </div>

      <textarea
        id="page-links-result"
        placeholder="Scanned page links will appear here..."
        rows="4"
        readonly
      ></textarea>

      <div class="panel-actions">
        <button id="copy-page-links">Copy</button>
        <button id="send-page-links-to-open">Send to Open URLs</button>
      </div>
    </details>

    <details id="open-urls-panel" class="panel">
      <summary>Open URLs</summary>

      <div class="textarea-toolbar">
        <button id="paste-urls" class="link-btn">Paste</button>
        <button id="copy-urls-input" class="link-btn">Copy</button>
        <button id="clear-urls-input" class="link-btn">Clear</button>
        <button id="extract-urls" class="link-btn">Extract URLs from text</button>
      </div>
      <textarea id="open-urls-input" placeholder="URL list (one per line)..." rows="4"></textarea>

      <div class="settings-grid">
        <div class="settings-col">
          <label class="checkbox">
            <input type="checkbox" id="opt-no-load" />
            Do not load tabs until selected
            <span class="info-dot" title="Opens each tab but keeps it unloaded (discarded) until you click it.">ⓘ</span>
          </label>
          <label class="checkbox"><input type="checkbox" id="opt-random-order" /> Load in random order</label>
          <label class="checkbox"><input type="checkbox" id="opt-reverse-order" /> Load in reverse order</label>
          <label class="checkbox"><input type="checkbox" id="opt-ignore-duplicates" checked /> Ignore duplicate URLs</label>
          <label class="checkbox"><input type="checkbox" id="opt-non-url-search" checked /> Handle non-URLs as search queries</label>

          <div class="settings-label">Tab group</div>
          <select id="tab-group-select">
            <option value="none">No Tab Group</option>
            <option value="new">New Tab Group</option>
          </select>
        </div>
        <div class="settings-col">
          <label class="radio"><input type="radio" name="open-mode" value="tab" checked /> Open each URL in new tab</label>
          <label class="radio"><input type="radio" name="open-mode" value="window" /> Open each URL in separate new window</label>
          <label class="radio">
            <input type="radio" name="open-mode" value="first-n" />
            Open only the first <input id="open-first-n" type="number" min="1" value="25" /> URLs
          </label>

          <label class="checkbox"><input type="checkbox" id="opt-preserve-input" /> Preserve input</label>
          <label class="checkbox"><input type="checkbox" id="opt-remove-opened" /> Remove opened URLs from the list</label>
          <label class="checkbox"><input type="checkbox" id="opt-remember-list" /> Remember the URL List</label>
        </div>
      </div>

      <div class="panel-actions">
        <button id="open-urls-btn" class="primary">Open URLs (0)</button>
      </div>
    </details>

    <ul id="tab-list"></ul>

    <p id="empty-state" class="empty" hidden>No tabs match your search.</p>

    <footer>
      <button id="edit-shortcut" class="link-btn">Customize keyboard shortcut</button>
      <div class="credit">
        <span id="version"></span> · Built by Muntasir
      </div>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
